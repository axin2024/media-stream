name: 问题报告
description: 提交可复现的运行问题
body:
  - type: input
    id: version
    attributes:
      label: 项目版本、操作系统、MySQL 和 FFmpeg
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 使用合成媒体，移除凭据和个人数据。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期结果、实际结果及相关会话事件
    validations:
      required: true
